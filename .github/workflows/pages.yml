name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.createPagesSite({
                owner,
                repo,
                build_type: 'workflow'
              });
              core.info('Pages site created with workflow builds');
            } catch (err) {
              if (err.status === 409) {
                core.info('Pages site already exists');
                try {
                  await github.rest.repos.updateInformationAboutPagesSite({
                    owner,
                    repo,
                    build_type: 'workflow'
                  });
                } catch (updateErr) {
                  core.info('Could not update Pages config: ' + updateErr.message);
                }
              } else {
                throw err;
              }
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
