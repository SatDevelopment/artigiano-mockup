<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Inizio · Artigiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Manrope:wght@500;600;700;800&family=Outfit:wght@500;650&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --bg-2: #10192b;
    --ink: #f4f7fb;
    --ink-2: #d5deea;
    --ink-3: #c5d2e2;
    --line: rgba(213, 222, 234, 0.22);
    --vetro: rgba(16, 28, 48, 0.72);
    --vetro-2: rgba(22, 36, 58, 0.88);
    --lastra: linear-gradient(180deg, rgba(236, 244, 255, 0.14), rgba(16, 28, 48, 0.55));
    --ombra: 0 18px 40px rgba(0, 0, 0, 0.28);
    --amber: #e8a23a;
    --amber-2: #f6e3a8;
    --amber-ink: #3a2a08;
    --danger: #ffe8e4;
    --danger-bg: #4a1d22;
    --ok: #b6f0c8;
    --ok-bg: #143226;
    --blu: #d7e6ff;
    --focus: #f6e3a8;
    --dock: rgba(10, 16, 28, 0.78);
    --r: 22px;
    --r-sm: 14px;
    --serif: "Fraunces", "Iowan Old Style", Palatino, "Times New Roman", serif;
    --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --num: "Outfit", "Manrope", sans-serif;
    --blur: 18px;
    --pad: 16px;
    --dock-h: 76px;
    color-scheme: dark;
  }
  [data-tema="avorio"] {
    --bg: #faf6f0;
    --bg-2: #f3ece3;
    --ink: #141820;
    --ink-2: #243044;
    --ink-3: #2c3a4e;
    --line: rgba(20, 24, 32, 0.14);
    --vetro: rgba(255, 250, 244, 0.78);
    --vetro-2: rgba(255, 252, 247, 0.94);
    --lastra: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 248, 236, 0.88));
    --ombra: 0 16px 36px rgba(48, 36, 18, 0.12);
    --amber: #c4841a;
    --amber-2: #f6e3a8;
    --amber-ink: #3a2a08;
    --danger: #4e1218;
    --danger-bg: #f8d6d4;
    --ok: #0e4a32;
    --ok-bg: #d7f5e4;
    --blu: #1d4e9f;
    --focus: #8a5a08;
    --dock: rgba(255, 250, 244, 0.86);
    color-scheme: light;
  }
  [data-stile="espressiva"] {
    --r: 28px;
    --r-sm: 18px;
    --blur: 0px;
    --vetro: #16243c;
    --vetro-2: #1c2d4a;
    --lastra: linear-gradient(165deg, #1e3a68 0%, #14243f 55%, #1a2a22 140%);
    --ombra: 0 10px 0 rgba(0, 0, 0, 0.18);
  }
  [data-tema="avorio"][data-stile="espressiva"] {
    --vetro: #fff7ea;
    --vetro-2: #fff;
    --lastra: linear-gradient(165deg, #ffe3a4 0%, #fff6e4 42%, #e7f0ff 100%);
    --ombra: 0 8px 0 rgba(58, 42, 8, 0.08);
  }
  [data-stile="espressiva"] .carta,
  [data-stile="espressiva"] .voce,
  [data-stile="espressiva"] .lastra { border: 0; }
  [data-stile="espressiva"] .lastra .faccia { background: #14243f; }
  [data-tema="avorio"][data-stile="espressiva"] .lastra .faccia { background: #fff1d4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; }
  button, a, [role="slider"] { touch-action: manipulation; }
  svg { width: 20px; height: 20px; flex: none; vertical-align: -4px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .app {
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(120% 60% at 100% -10%, rgba(232, 162, 58, 0.18), transparent 46%),
      radial-gradient(90% 50% at -10% 20%, rgba(90, 140, 220, 0.16), transparent 42%),
      var(--bg);
  }
  [data-stile="espressiva"] .app {
    background:
      radial-gradient(80% 40% at 110% 0%, rgba(232, 162, 58, 0.45), transparent 50%),
      radial-gradient(70% 40% at -20% 80%, rgba(80, 140, 255, 0.28), transparent 46%),
      var(--bg);
  }
  .header {
    padding: calc(8px + env(safe-area-inset-top)) var(--pad) 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
  }
  .header[data-scrolled="true"] {
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(16px);
  }
  .mark {
    width: 36px; height: 36px; border-radius: 12px;
    display: grid; place-items: center;
    background: conic-gradient(from 210deg, #8eb6ff, #f6e3a8, #8eb6ff);
    color: #10203a;
    font-family: var(--serif);
    font-weight: 650;
    font-size: 22px;
    flex: none;
  }
  [data-tema="avorio"] .mark { color: #10203a; }
  .quando { min-width: 0; flex: 1; }
  .quando b, .quando span { display: block; }
  .quando b { font-size: 13px; font-weight: 700; text-transform: capitalize; }
  .quando span { font-family: var(--num); font-size: 12px; font-weight: 650; color: var(--ink-2); letter-spacing: 0.04em; }
  .icona {
    width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center; position: relative; flex: none;
  }
  .icona svg { width: 22px; height: 22px; }
  .badge {
    position: absolute; top: 6px; right: 4px;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 99px; background: #e23b3b; color: #fff;
    font-size: 10px; font-weight: 800; display: grid; place-items: center;
  }
  .proto {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    padding: 0 var(--pad) 8px;
  }
  .chip {
    min-height: 36px; padding: 0 8px; border-radius: 999px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--vetro-2) 80%, transparent);
    color: var(--ink-2); font-size: 13px; font-weight: 700;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--bg); border-color: transparent;
  }
  [data-tema="avorio"] .chip[aria-pressed="true"] { color: #faf6f0; }
  main {
    flex: 1; overflow: auto; overscroll-behavior: contain;
    padding: 4px var(--pad) calc(var(--dock-h) + env(safe-area-inset-bottom) + 18px);
    -webkit-overflow-scrolling: touch;
  }
  .pull {
    height: 0; overflow: visible; display: grid; justify-items: center;
    color: var(--ink-2); font-size: 13px; font-weight: 700;
  }
  .pull span {
    transform: translate3d(0, -36px, 0); opacity: 0;
    background: var(--vetro-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px;
  }
  .nota-prova { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
  .kicker {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    margin: 6px 0 0;
  }
  .kicker strong {
    font-size: 12px; letter-spacing: 0.12em; font-weight: 800; color: var(--ink-2);
  }
  .rete {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; color: var(--ink-2); font-size: 13px; font-weight: 700;
  }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }
  [data-offline="true"] .punto { background: #e0a23a; }
  h1.saluto {
    font-family: var(--serif);
    font-size: 2.15rem; font-weight: 560; letter-spacing: -0.03em;
    line-height: 1.05; margin: 4px 0 6px;
  }
  [data-stile="espressiva"] h1.saluto { font-weight: 650; font-size: 2.35rem; }
  .lede { margin: 0 0 14px; color: var(--ink-2); font-size: 1.02rem; line-height: 1.35; font-weight: 600; }
  .lede em { font-style: normal; color: var(--ink); }
  .carta, .lastra, .voce, .recap, .avviso {
    border-radius: var(--r);
    border: 1px solid var(--line);
    background: var(--vetro);
    box-shadow: var(--ombra);
  }
  [data-stile="vetro"] .carta,
  [data-stile="vetro"] .lastra,
  [data-stile="vetro"] .voce,
  [data-stile="vetro"] .recap {
    backdrop-filter: blur(var(--blur)) saturate(1.3);
  }
  .carta, .recap, .avviso { padding: 14px 14px 12px; margin: 0 0 12px; }
  .lastra { padding: 14px; margin: 0 0 12px; position: relative; background: var(--lastra); }
  .testa-sez {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .testa-sez h2, .carta h2, .lastra h2 { font-size: 1.15rem; margin: 0; letter-spacing: -0.02em; }
  .link {
    min-height: 44px; display: inline-flex; align-items: center; gap: 4px;
    color: var(--blu); font-weight: 800; font-size: 14px;
  }
  .recap { display: flex; gap: 10px; background: var(--ok-bg); color: var(--ok); border-color: transparent; padding: 10px 12px; }
  .recap p, .recap h2 { margin: 0; }
  .recap h2 { font-size: 1rem; }
  .recap .x { margin-left: auto; width: 44px; height: 44px; }
  .striscia {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 12px; margin: 0 0 12px; border-radius: var(--r-sm);
    background: color-mix(in srgb, var(--blu) 16%, var(--vetro-2));
    color: var(--ink); font-weight: 700; font-size: 14px;
  }
  .striscia button { margin-left: auto; min-height: 44px; font-weight: 800; color: var(--blu); }
  .fase {
    display: flex; align-items: center; gap: 8px; color: var(--ink-2);
    font-size: 13px; font-weight: 800;
  }
  .fase .tra { margin-left: auto; font-family: var(--num); color: var(--ink); }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 26px; padding: 0 8px; border-radius: 999px;
    background: var(--danger-bg); color: var(--danger); font-size: 12px; font-weight: 800;
  }
  .pill.ambra { background: var(--amber-2); color: var(--amber-ink); }
  .pill.blu { background: color-mix(in srgb, var(--blu) 18%, var(--vetro-2)); color: var(--ink); }
  .pill.verde { background: var(--ok-bg); color: var(--ok); }
  .parola {
    margin: 8px 0 0; font-size: 13px; font-weight: 800; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--amber-ink);
    background: var(--amber-2); display: inline-block; border-radius: 999px; padding: 4px 8px;
  }
  .identita { margin-top: 8px; }
  .nome {
    display: flex; align-items: center; gap: 10px; margin: 0;
    font-size: 1.25rem; letter-spacing: -0.02em;
  }
  .nome span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .anello {
    width: 72px; height: 72px; border-radius: 50%; flex: none;
    display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 40% 35%, #ffe9b0, #f6d56a 68%, #e8a23a);
    color: #1a1004; font-family: var(--num); font-weight: 650; font-size: 16px;
  }
  .anello i, .anello b {
    position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid rgba(232, 162, 58, 0.75); pointer-events: none;
  }
  .anello b { animation: impulso 1.8s ease-out infinite; }
  @keyframes impulso {
    0% { transform: scale(0.92); opacity: 0.8; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  .desc, .luogo, .squadra { margin: 4px 0 0; color: var(--ink-2); font-weight: 650; font-size: 14px; }
  .flag {
    margin: 10px 0 0; display: flex; gap: 8px; align-items: center;
    background: var(--danger-bg); color: var(--danger);
    border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 14px;
  }
  .scorri { position: relative; overflow: hidden; border-radius: 16px; }
  .chiedi {
    position: absolute; right: 0; top: 0; bottom: 0; width: 108px;
    background: #1fa855; color: #06210f; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .faccia {
    position: relative; background: var(--vetro-2); text-align: left; width: 100%;
    border-radius: 16px; padding: 4px 4px 8px; touch-action: pan-y;
  }
  .lastra .faccia { background: var(--bg-2); padding: 8px; border-radius: 16px; }
  .cursore {
    position: relative; height: 52px; margin-top: 12px; border-radius: 999px;
    background: #f6e3a8; color: #3a2a08; touch-action: none; user-select: none;
  }
  .cursore .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
    background: #efd48a; border-radius: inherit; transform-origin: left center; transform: scaleX(0);
  }
  .cursore .etichetta {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-weight: 800; font-size: 14px; pointer-events: none;
  }
  .pollice {
    position: absolute; top: 4px; left: 4px; width: 44px; height: 44px; border-radius: 50%;
    background: #1a2744; color: #fff; display: grid; place-items: center;
    will-change: transform;
  }
  [data-tema="avorio"] .pollice { background: #142033; }
  .azioni {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
  }
  .pastiglia {
    flex: 1 1 64px; min-width: 44px; min-height: 64px;
    border-radius: 16px; background: color-mix(in srgb, var(--ink) 8%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 12px; font-weight: 800; color: var(--ink);
  }
  .pastiglia.prima { background: var(--ink); color: var(--bg); }
  [data-tema="avorio"] .pastiglia.prima { color: #faf6f0; }
  .pastiglia svg { width: 20px; height: 20px; }
  .giorni { display: flex; gap: 6px; overflow: auto; padding-bottom: 8px; margin: 0 -2px 8px; }
  .giorni button {
    flex: none; min-height: 44px; padding: 6px 10px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--vetro); text-align: left;
  }
  .giorni button[aria-current="true"] { background: var(--ink); color: var(--bg); }
  [data-tema="avorio"] .giorni button[aria-current="true"] { color: #faf6f0; }
  .giorni small, .giorni b { display: block; }
  .giorni b { font-family: var(--num); font-size: 16px; }
  .giorni small { font-size: 12px; font-weight: 700; color: inherit; }
  .giorno-h {
    position: sticky; top: 0; z-index: 2;
    display: flex; gap: 10px; align-items: center;
    padding: 8px 4px; margin: 0 0 8px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .num {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: var(--ink); color: var(--bg); font-family: var(--num); font-weight: 650; font-size: 18px;
  }
  [data-tema="avorio"] .num { color: #faf6f0; }
  .giorno-h p { margin: 0; }
  .giorno-h p b { display: block; }
  .giorno-h p span { color: var(--ink-2); font-size: 13px; font-weight: 700; }
  .voce { padding: 10px; margin: 0 0 10px; position: relative; overflow: hidden; }
  .capsula {
    width: 64px; min-height: 48px; border-radius: 16px; flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    font-family: var(--num); font-weight: 650;
  }
  .riga { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; }
  .corpo { min-width: 0; flex: 1; }
  .corpo strong, .titolo { display: block; font-size: 15px; }
  .adesso-riga {
    display: flex; align-items: center; gap: 8px; color: var(--amber-ink);
    font-weight: 800; margin: 4px 0 10px;
  }
  .adesso-riga i { flex: 1; height: 2px; background: var(--amber); display: block; }
  .lama::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: #e23b3b;
  }
  .lama::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 30%; left: 0;
    background: linear-gradient(90deg, transparent, rgba(226, 59, 59, 0.35), transparent);
    animation: sweep 12s linear infinite; pointer-events: none;
  }
  @keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(420%); } }
  .mini { display: flex; gap: 6px; margin-top: 8px; }
  .mini button {
    width: 48px; height: 48px; border-radius: 12px; background: #d7c4a1; color: #3a2a08; font-size: 11px; font-weight: 800;
  }
  .barra { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
  .parola-btn { min-height: 44px; font-weight: 800; font-size: 14px; color: var(--ok); }
  .parola-btn.quiet { color: var(--ink-2); }
  .tessere { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tessera {
    text-align: left; min-height: 88px; padding: 10px; border-radius: 16px;
    background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink);
  }
  .tessera.larga { grid-column: 1 / -1; }
  .tessera b { display: block; font-size: 14px; }
  .tessera span { color: var(--ink-2); font-size: 13px; font-weight: 650; }
  .banco { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .banco a, .banco button {
    min-height: 76px; border-radius: 16px; background: color-mix(in srgb, var(--ink) 6%, transparent);
    display: flex; flex-direction: column; justify-content: center; padding: 8px; color: inherit; text-decoration: none;
  }
  .banco b { font-family: var(--num); font-size: 28px; }
  .banco span { color: var(--ink-2); font-size: 12px; font-weight: 800; }
  .prog {
    height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 10%, transparent); margin: 8px 0;
  }
  .prog i { display: block; height: 100%; border-radius: inherit; background: var(--ink-2); width: 0; }
  .btn {
    min-height: 48px; padding: 0 14px; border-radius: 14px; font-weight: 800;
    background: var(--ink); color: var(--bg);
  }
  [data-tema="avorio"] .btn { color: #faf6f0; }
  .btn.sec { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .riga-passo { display: flex; gap: 8px; align-items: center; width: 100%; min-height: 48px; text-align: left; }
  .spark { width: 100%; height: 54px; }
  .mesi { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; color: var(--ink-2); font-size: 12px; font-weight: 700; }
  .dock::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 22px;
    background: linear-gradient(transparent, var(--bg)); pointer-events: none;
  }
  .dock {
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(480px, 100%);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
    background: var(--dock);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    z-index: 6;
  }
  [data-stile="espressiva"] .dock { background: var(--vetro-2); backdrop-filter: none; }
  .dock-lato { display: flex; gap: 4px; }
  .dock-lato.dx { justify-content: flex-end; }
  .anna {
    width: 64px; height: 64px; border-radius: 50%; margin-bottom: 6px;
    background: radial-gradient(circle at 30% 30%, #fff6d8, #e8a23a 45%, #1d4e9f 80%);
    color: #10203a; font-family: var(--serif); font-size: 28px; font-weight: 650;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .backdrop { position: absolute; inset: 0; background: rgba(6, 10, 18, 0.46); }
  .sheet {
    position: relative; z-index: 1;
    width: min(480px, 100%); max-height: min(92dvh, 760px); overflow: auto;
    background: var(--bg-2); color: var(--ink);
    border-radius: 28px 28px 0 0; padding: 10px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow: var(--ombra);
  }
  .sheet header { display: flex; align-items: center; gap: 8px; }
  .sheet h2 { font-family: var(--serif); font-weight: 560; font-size: 1.6rem; margin: 8px 0; }
  .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 8px; }
  .lista button, .lista a {
    width: 100%; min-height: 52px; text-align: left; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-weight: 750; text-decoration: none; color: inherit;
  }
  textarea {
    width: 100%; min-height: 96px; border-radius: 16px; padding: 12px;
    border: 1px solid var(--line); background: var(--vetro); font-size: 16px;

  function tra(min) {

  function passoMolla(x, dest, v, stiff, damp, riposo) {
    if (ridotto()) return { x: dest, v: 0, fermo: true };
    const nv = (v + (dest - x) * stiff) * damp;
    const n = x + nv;
    if (Math.abs(dest - n) < riposo && Math.abs(nv) < riposo) return { x: dest, v: 0, fermo: true };

    const memo = new Date(now.getTime() + 200 * 60000);

    return { now, next, past, late, memo, ieri, domani, dopo, fatto };

    }

      if (c.chiuso) return;
      if (mosso < 10 || c.p >= SOGLIA) chiudiCursore(el);
      else mollaCursore(el, 0);
      return;
    }
    const s = statoSwipe(el);
    mollaSwipe(el, s.x < SWIPE_SOGLIA ? SWIPE_APERTO : 0);
    if (s.trascinato) setTimeout(() => { s.trascinato = false; }, 400);
  }
  function legaGesti() {
    document.querySelectorAll('[data-cursore]').forEach((p) => { statoCursore(p); p._c.dipingi(p._c.p); });
    document.querySelectorAll('[data-swipe]').forEach((b) => statoSwipe(b));
  }
  document.addEventListener('pointerdown', giuGesto);
  document.addEventListener('touchstart', giuGesto, { passive: true });
  window.addEventListener('pointermove', muoviGesto, { passive: false });
  window.addEventListener('touchmove', muoviGesto, { passive: false });
  window.addEventListener('pointerup', suGesto);
  window.addEventListener('pointercancel', suGesto);
  window.addEventListener('touchend', suGesto);
  window.addEventListener('touchcancel', suGesto);

  function legaPull() {
    const main = $('#main');
    const label = $('#pull-label');
    let start = 0, dy = 0, pronto = false, via = '';
    main.addEventListener('scroll', () => {
      $('#header').dataset.scrolled = main.scrollTop > 4 ? 'true' : 'false';
    }, { passive: true });
    function zonaLibera(t) {
      return !(t instanceof Element) || !t.closest('[data-cursore], [data-swipe], .dock, .proto, header, .giorni');
    }
    function begin(y, kind, target) {
      if (main.scrollTop > 2 || !zonaLibera(target)) return;
      start = y; dy = 0; pronto = true; via = kind;
    }
    function move(y, e) {
      if (!pronto) return;
      dy = y - start;
      if (dy > 0 && main.scrollTop <= 2) {
        if (e.cancelable) e.preventDefault();
        const d = Math.min(dy * 0.45, 84);
        label.style.transform = 'translate3d(0,' + (d - 36) + 'px,0)';
        label.style.opacity = String(Math.min(1, d / 56));
        label.textContent = d > 56 ? 'Rilascia per aggiornare' : 'Tira per aggiornare';
      }
    }
    function fine() {
      if (!pronto) return;
      const abbastanza = dy > 70 && main.scrollTop <= 2;
      pronto = false; dy = 0; via = '';
      label.style.transform = 'translate3d(0,-36px,0)';
      label.style.opacity = '0';
      label.textContent = 'Tira per aggiornare';
      if (!abbastanza) return;
      state.loading = true; paint();
      setTimeout(() => { state.loading = false; state.programma = 'dati'; paint(); toast('Giornata aggiornata.'); }, ridotto() ? 0 : 700);
    }
    main.addEventListener('touchstart', (e) => begin(e.touches[0].clientY, 'touch', e.target), { passive: true });
    main.addEventListener('touchmove', (e) => { if (via === 'touch') move(e.touches[0].clientY, e); }, { passive: false });
    main.addEventListener('touchend', () => { if (via === 'touch') fine(); });
    main.addEventListener('touchcancel', () => { if (via === 'touch') fine(); });
    main.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') begin(e.clientY, 'pointer', e.target); });
    main.addEventListener('pointermove', (e) => { if (via === 'pointer') move(e.clientY, e); });
    main.addEventListener('pointerup', () => { if (via === 'pointer') fine(); });
    main.addEventListener('pointercancel', () => { if (via === 'pointer') fine(); });
  }

  document.body.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    azione(b.dataset.act, b);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { state.sheet = null; state.menu = false; paintOverlay(); }
  });

  const body = document.getElementById('mappa-body');
  body.innerHTML = MAPPA.map((r) => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>').join('') +
    '<tr><td colspan="2"><button class="btn sec" data-act="mostra-dati">Programma con i dati</button> <button class="btn sec" data-act="mostra-vuoto">Settimane vuote</button> <button class="btn sec" data-act="mostra-errore">Errore di caricamento</button> <button class="btn sec" data-act="mostra-scheletro">Scheletro</button> <button class="btn sec" data-act="mostra-2fa">Mostra avviso verifica</button></td></tr>';

  legaPull();
  if (ridotto()) paint();
  else {
    $('#stage').innerHTML = '<div class="skel lg"></div><div class="skel"></div><div class="skel lg"></div>';
    setTimeout(paint, 420);
  }
  window.__homeOk = true;
})();
</script>
</body>
</html>
